<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Experience Platform</title>
    <style>
      :root {
        font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #0f172a;
        background-color: #e7ecef;
        --mobile-frame-width: 428px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e7ecef;
      }

      body {
        position: relative;
        font-size: 16px;
        background: #e7ecef;
        display: flex;
        justify-content: center;
        align-items: stretch;
        min-height: 100vh;
        padding: clamp(12px, 4vw, 48px);
      }

      .app-shell {
        width: min(var(--mobile-frame-width), 100%);
        min-height: calc(100vh - clamp(24px, 8vw, 96px));
        display: flex;
        flex-direction: column;
        position: relative;
        background: #e7ecef;
        border-radius: 32px;
        border: 1px solid rgba(148, 163, 184, 0.4);
        box-shadow:
          0 30px 60px rgba(15, 23, 42, 0.2),
          0 0 0 1px rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }

      #app {
        flex: 1;
        width: 100%;
        min-height: 100%;
      }

      #startup-animation {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(
          circle at top,
          rgba(231, 236, 239, 0.95),
          #e7ecef
        );
        transition: opacity 0.6s ease;
        z-index: 10;
      }

      #startup-animation::after {
        content: "";
        position: absolute;
        inset: 10%;
        border-radius: 40px;
        background: linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.2),
          rgba(14, 165, 233, 0.12) 45%,
          rgba(236, 72, 153, 0.18)
        );
        filter: blur(68px);
        z-index: -1;
      }

      #startup-animation.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #startup-frame {
        width: min(calc(var(--mobile-frame-width) - 64px), 80vw);
        aspect-ratio: 9 / 16;
        display: flex;
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 25px 90px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        background: #e7ecef;
      }

      @supports not (aspect-ratio: 9 / 16) {
        #startup-frame::before {
          float: left;
          padding-top: calc(100% * 16 / 9);
          content: "";
        }
        #startup-frame::after {
          display: block;
          content: "";
          clear: both;
        }
      }

      #startup-animation video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #e7ecef;
      }
    </style>
  </head>
  <body>
    <div id="startup-animation">
      <div id="startup-frame">
        <video
          id="startup-video"
          src="/src/assets/animatedlogo.mp4"
          autoplay
          muted
          playsinline
        ></video>
      </div>
    </div>
    <div class="app-shell">
      <div id="app"></div>
    </div>
    <script>
      (function () {
        const splash = document.getElementById("startup-animation");
        const video = document.getElementById("startup-video");

        if (!splash || !video) {
          return;
        }

        const hideSplash = () => {
          splash.classList.add("is-hidden");
        };

        video.addEventListener("ended", hideSplash, { once: true });

        window.addEventListener(
          "load",
          () => {
            setTimeout(() => {
              if (!splash.classList.contains("is-hidden")) {
                hideSplash();
              }
            }, 7000);
          },
          { once: true }
        );
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
