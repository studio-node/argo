<a-scene
  landing-page
  vps-coaching-overlay
  init-data-handler
  background="color: #303030"
  renderer="colorManagement: true"
  gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
  return-to-map
  xrextras-runtime-error
  xrextras-loading
  xrweb="enableVps: true">
  <a-assets>
    <a-asset-item id="vps-mesh" src=".././assets/wayspot-meshes/vasion-activ.glb"></a-asset-item>
  </a-assets>

  <div id="top-section">
    <button id="map-btn">Return to Map</button>
  </div>

  <a-camera position="0 2 2" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
  </a-camera>

  <!-- add a wayspot to the project from the geospatial browser
  and replace the name with the 'name' of the wayspot -->
  <a-entity id="wayspot" named-wayspot="name: vasion-activ" load-placed-objects>
    <!-- apply hider material to the mesh to realistically occlude content -->
    <a-entity
      class="cantap"
      gltf-model="#vps-mesh"
      hider-material
      tap-place="modelUrl: https://iyrjpsrdycibqptixpiu.supabase.co/storage/v1/object/public/ar-models/Flower1PurpleAnimated.glb">
    </a-entity>

    <!-- apply shadow shader to the mesh to realistically receive shadows -->
    <a-entity gltf-model="#vps-mesh" shadow-shader shadow="cast: false"></a-entity>
  </a-entity>

  <!-- <a-entity named-wayspot="name: lost-in-my-a">
    <a-entity gltf-model="#vps-mesh" xrextras-hider-material> </a-entity>
    <a-entity gltf-model="#vps-mesh" shadow-shader shadow="cast: false"> </a-entity>
  </a-entity> -->

  <a-entity
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 10;
      shadowCameraBottom: -10;
      shadowCameraRight: 10;
      shadowCameraLeft: -10;"
    position="0 10 -6"
    shadow>
  </a-entity>

  <a-light type="ambient" intensity="0.5"></a-light>
</a-scene>
